<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banaras Heritage Guide</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#fff8ed;
  color:#33251c;
  line-height:1.6;
}

header{
  background:linear-gradient(135deg,#7b1e1e,#d97706);
  color:white;
  text-align:center;
  padding:35px 20px;
}

header h1{
  font-size:32px;
  margin-bottom:8px;
}

header p{
  font-size:17px;
}

nav{
  background:#4a1717;
  text-align:center;
  padding:12px;
  position:sticky;
  top:0;
  z-index:10;
}

nav a{
  color:white;
  text-decoration:none;
  margin:0 8px;
  font-size:14px;
}

.hero{
  text-align:center;
  padding:45px 20px;
  background:#fff0d5;
}

.hero h2{
  font-size:30px;
  color:#7b1e1e;
  margin-bottom:10px;
}

.hero p{
  font-size:17px;
}

.button{
  display:inline-block;
  background:#25D366;
  color:white;
  padding:13px 22px;
  margin-top:20px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

section{
  padding:35px 18px;
  max-width:1100px;
  margin:auto;
}

section h2{
  text-align:center;
  color:#7b1e1e;
  margin-bottom:25px;
  font-size:27px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:white;
  padding:22px;
  border-radius:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.card h3{
  color:#b45309;
  margin-bottom:8px;
}

.booking{
  background:#fff0d5;
  border-radius:15px;
  padding:25px;
}

form{
  max-width:600px;
  margin:auto;
}

input,select,textarea{
  width:100%;
  padding:13px;
  margin:8px 0 14px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:16px;
}

label{
  font-weight:bold;
}

.submit{
  width:100%;
  border:0;
  background:#25D366;
  color:white;
  padding:15px;
  border-radius:8px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.info{
  text-align:center;
  margin-top:20px;
  font-size:18px;
}

footer{
  background:#4a1717;
  color:white;
  text-align:center;
  padding:25px 15px;
  margin-top:20px;
}

@media(max-width:600px){
  header h1{font-size:27px;}
  .hero h2{font-size:25px;}
}
</style>
</head>

<body>

<header>
  <h1>🕉️ Banaras Heritage Guide</h1>
  <p>काशी को करीब से
